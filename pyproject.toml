[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanterna"
version = "0.1.0"
description = "Analytics di prima parte per siti web: raccolta senza cookie, eventi di business, interrogazioni dichiarate, rapporti e interpretazione dei dati — nel proprio PostgreSQL, senza servizi terzi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Paese e città dall'indirizzo IP (file .mmdb di DB-IP o MaxMind, scaricato a parte).
geo = ["maxminddb>=2.5"]
# Il router di raccolta e di export per FastAPI.
fastapi = ["fastapi>=0.110", "maxminddb>=2.5"]
# L'export delle viste in Excel.
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["lanterna*"]

[tool.setuptools.package-data]
lanterna = ["colab/*.ipynb"]
